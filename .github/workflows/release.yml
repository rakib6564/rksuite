name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-please:
    name: Semantic versioning and changelog
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Build and publish plugin release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Verify tag matches plugin version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          plugin_version="$(grep -oiP 'Version:\s*\K[0-9.]+' rk-suite/rk-suite.php | head -1)"
          echo "Tag: ${tag_version}; plugin header: ${plugin_version}"
          if [ "${tag_version}" != "${plugin_version}" ]; then
            echo "::error::The Git tag does not match the Version header in rk-suite/rk-suite.php."
            exit 1
          fi
      - name: Build distributable zip
        run: bash scripts/build-zip.sh
      - name: Publish GitHub Release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rk-suite.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
